<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- The 16px cut. At sixteen device pixels the burst marks and the ring merge into one grey
       blob, so this drops the burst entirely, thickens the ring and enlarges the cursor. Same
       idea — a ring and the cursor coming through it — with only what survives the pixel grid. -->
  <path d="M 76.7 12.6 A 50 50 0 1 0 68.6 96.5"
        fill="none" stroke="#6d5ae6" stroke-width="20" stroke-linecap="round" />
  <path d="M 0 0 L 0 68 L 19 53 L 32 81 L 44 75.5 L 31 49 L 52 47 Z"
        transform="translate(50 42) rotate(-6) scale(1.12)"
        fill="#ffffff" stroke="#6d5ae6" stroke-width="15" stroke-linejoin="round" />
</svg>
