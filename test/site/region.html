<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>Region anchoring fixture</title>
<style>
  body { font-family: system-ui; margin: 0; background: #fafafa; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  /* Small labels directly above the card. Overshooting the card upward covers most of THEIR
     area while accounting for almost none of the drawn box — the shape that used to drag the
     anchor up to <main>. */
  .steps { display: flex; justify-content: space-between; padding: 0 40px 12px; }
  .step-label { font-size: 12px; color: #666; }
  .section-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 12px; padding: 20px; }
  .section-head { font-weight: 600; margin-bottom: 12px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .field { height: 56px; border: 1px solid #e5e5e5; border-radius: 8px; }
</style>
</head>
<body>
<main>
  <div class="steps">
    <span class="step-label">Basic Info</span>
    <span class="step-label">Company</span>
    <span class="step-label">Personal</span>
  </div>

  <div class="section-card" id="first">
    <div class="section-head">Basic Contact Information</div>
    <div class="grid"><div class="field"></div><div class="field"></div><div class="field"></div></div>
    <div class="grid"><div class="field"></div><div class="field"></div><div class="field"></div></div>
  </div>

  <div class="section-card" id="second" style="margin-top: 16px;">
    <div class="section-head">Event-Related Questions</div>
    <div class="grid"><div class="field"></div><div class="field"></div><div class="field"></div></div>
  </div>
</main>
</body>
</html>
